<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>记账本</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f5f5f5;
  --card: #ffffff;
  --text: #333333;
  --text-secondary: #888888;
  --border: #e8e8e8;
  --primary: #4f6ef7;
  --primary-light: #eef1ff;
  --expense: #f56c6c;
  --expense-bg: #fef0f0;
  --income: #67c23a;
  --income-bg: #f0f9eb;
  --shadow: 0 1px 3px rgba(0,0,0,.06);
  --radius: 12px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px 12px;
}

/* Header */
.header {
  text-align: center;
  padding: 28px 0 16px;
}
.header h1 {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
}

/* Tabs */
.tabs {
  display: flex;
  background: var(--card);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 8px;
  z-index: 10;
}
.tab {
  flex: 1;
  text-align: center;
  padding: 10px 0;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all .2s;
  border: none;
  background: none;
}
.tab.active { background: var(--primary); color: #fff; }
.tab:hover:not(.active) { background: #f0f0f0; }

/* Summary Cards */
.summary-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.summary-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
}
.summary-card .label { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
.summary-card .amount { font-size: 18px; font-weight: 700; }
.summary-card .amount.income { color: var(--income); }
.summary-card .amount.expense { color: var(--expense); }
.summary-card .amount.balance { color: var(--primary); }

/* Section */
.section { display: none; }
.section.active { display: block; }


/* ===== Form ===== */
.form-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px 16px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.form-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
.form-group label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  background: #fafafa;
  transition: border-color .2s;
  outline: none;
  -webkit-appearance: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary);
  background: #fff;
}

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  font-family: inherit;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; width: 100%; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-outline { background: #fff; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-outline:active { border-color: var(--primary); color: var(--primary); }
.btn-danger { background: #fff; color: var(--expense); border: 1px solid var(--expense); }
.btn-danger:active { background: var(--expense-bg); }

/* Type toggle */
.type-toggle {
  display: flex;
  background: #f0f0f0;
  border-radius: 8px;
  padding: 3px;
  margin-bottom: 14px;
}
.type-btn {
  flex: 1;
  padding: 8px 0;
  text-align: center;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  border: none;
  background: none;
  color: var(--text-secondary);
  transition: all .2s;
}
.type-btn.active-expense { background: var(--expense); color: #fff; }
.type-btn.active-income { background: var(--income); color: #fff; }

/* Records Table */
.records-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  margin-bottom: 16px;
}
.records-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.records-header h3 { font-size: 15px; font-weight: 600; }
.filter-row {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.filter-row select, .filter-row input {
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 12px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  background: #fafafa;
  -webkit-appearance: none;
}
table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 10px 12px;
  text-align: left;
  font-size: 12px;
}
th {
  color: var(--text-secondary);
  font-weight: 500;
  background: #fafafa;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
}
td { border-bottom: 1px solid #f5f5f5; }
tr:active td { background: #f5f5f5; }
.tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.tag-expense { background: var(--expense-bg); color: var(--expense); }
.tag-income { background: var(--income-bg); color: var(--income); }
.empty-msg {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
  font-size: 14px;
}

/* Charts */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.chart-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--text-secondary); }
.chart-card canvas { max-height: 240px; }

.action-bar {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  justify-content: flex-end;
  flex-wrap: wrap;
}

/* AI Chat */
.ai-msg { padding: 12px 16px; border-bottom: 1px solid #f5f5f5; font-size: 13px; line-height: 1.7; }
.ai-msg.user { background: var(--primary-light); }
.ai-msg.assistant { background: #fff; }
.ai-msg .role { font-size: 11px; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
.ai-msg.assistant .role { color: var(--primary); }
.ai-msg.user .role { color: var(--expense); }
.ai-msg p { margin: 4px 0; }
.ai-msg strong { color: var(--text); }
.ai-loading { padding: 12px 16px; font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }
.ai-loading .dot-flash::after { content: '...'; animation: dots 1.5s infinite; }
@keyframes dots { 0%,20% { content: '.'; } 40% { content: '..'; } 60%,100% { content: '...'; } }

/* File input hidden */
#file-input { display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="header"><h1>💰 记账本</h1></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="add">记一笔</button>
    <button class="tab" data-tab="list">明细</button>
    <button class="tab" data-tab="stats">统计</button>
    <button class="tab" data-tab="ai">🤖 AI</button>
  </div>

  <!-- Summary -->
  <div class="summary-row">
    <div class="summary-card">
      <div class="label">本月收入</div>
      <div class="amount income" id="sum-income">¥0.00</div>
    </div>
    <div class="summary-card">
      <div class="label">本月支出</div>
      <div class="amount expense" id="sum-expense">¥0.00</div>
    </div>
    <div class="summary-card">
      <div class="label">本月结余</div>
      <div class="amount balance" id="sum-balance">¥0.00</div>
    </div>
  </div>

  <!-- Section: 记一笔 -->
  <div class="section active" id="sec-add">

    <!-- 手动输入 -->
    <div class="form-card">
      <div class="form-title">手动输入</div>
      <div class="type-toggle">
        <button class="type-btn active-expense" data-type="expense" id="type-expense">支出</button>
        <button class="type-btn" data-type="income" id="type-income">收入</button>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>金额 (¥)</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" inputmode="decimal">
        </div>
        <div class="form-group">
          <label>分类</label>
          <select id="category">
            <optgroup label="支出分类">
              <option value="餐饮">🍔 餐饮</option>
              <option value="交通">🚗 交通</option>
              <option value="购物">🛍️ 购物</option>
              <option value="娱乐">🎮 娱乐</option>
              <option value="居住">🏠 居住</option>
              <option value="通讯">📱 通讯</option>
              <option value="医疗">💊 医疗</option>
              <option value="教育">📚 教育</option>
              <option value="其他支出">📌 其他支出</option>
            </optgroup>
            <optgroup label="收入分类">
              <option value="工资">💼 工资</option>
              <option value="兼职">💻 兼职</option>
              <option value="理财">📈 理财</option>
              <option value="红包">🧧 红包</option>
              <option value="其他收入">📌 其他收入</option>
            </optgroup>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="date">
        </div>
        <div class="form-group">
          <label>备注</label>
          <input type="text" id="note" placeholder="可选">
        </div>
      </div>
      <button class="btn btn-primary" id="btn-add">记一笔</button>
    </div>

    <!-- 最近5条 -->
    <div class="records-card">
      <div class="records-header"><h3>最近记录</h3></div>
      <div id="recent-list">
        <div class="empty-msg">还没有记录，开始记第一笔吧 🎉</div>
      </div>
    </div>
  </div>

  <!-- Section: 明细 -->
  <div class="section" id="sec-list">
    <div class="records-card">
      <div class="records-header">
        <h3>所有记录</h3>
        <span style="font-size:13px;color:var(--text-secondary)" id="record-count">共 0 条</span>
      </div>
      <div class="filter-row">
        <select id="filter-month"><option value="">全部月份</option></select>
        <select id="filter-type">
          <option value="">全部类型</option>
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
        <select id="filter-category"><option value="">全部分类</option></select>
        <input type="text" id="filter-note" placeholder="搜索备注..." style="flex:1;min-width:80px">
      </div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th><th>操作</th></tr></thead>
          <tbody id="records-body">
            <tr><td colspan="6"><div class="empty-msg">暂无记录</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="action-bar">
      <button class="btn btn-sm btn-outline" id="btn-export">📥 导出</button>
      <button class="btn btn-sm btn-outline" id="btn-import-btn">📤 导入</button>
      <input type="file" id="import-file" accept=".json" style="display:none">
      <button class="btn btn-sm btn-danger" id="btn-clear">🗑️ 清空</button>
    </div>
  </div>

  <!-- Section: 统计 -->
  <div class="section" id="sec-stats">
    <div class="charts-grid">
      <div class="chart-card">
        <h3>近6个月收支趋势</h3>
        <canvas id="chart-trend"></canvas>
      </div>
      <div class="chart-card">
        <h3>本月支出分类</h3>
        <canvas id="chart-category"></canvas>
      </div>
    </div>
    <div class="records-card">
      <div class="records-header"><h3>月度汇总</h3></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>月份</th><th>收入</th><th>支出</th><th>结余</th></tr></thead>
          <tbody id="monthly-summary">
            <tr><td colspan="4"><div class="empty-msg">暂无数据</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Section: AI 助手 -->
  <div class="section" id="sec-ai">
    <div class="ai-setup" id="ai-setup">
      <div class="form-card">
        <div class="form-title">🤖 配置 AI 助手</div>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">输入 DeepSeek API Key，即可用自然语言分析记账数据。Key 仅保存在你的浏览器中。</p>
        <div class="form-group" style="margin-bottom:12px">
          <input type="password" id="ai-key-input" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx" style="font-size:13px">
        </div>
        <button class="btn btn-primary" id="btn-save-key">保存并开始</button>
        <p style="font-size:11px;color:var(--text-secondary);margin-top:8px;text-align:center">
          还没有 Key？<a href="https://platform.deepseek.com" target="_blank" style="color:var(--primary)">去 DeepSeek 获取</a>
        </p>
      </div>
    </div>

    <div id="ai-chat-area" style="display:none">
      <div class="records-card" id="ai-messages" style="margin-bottom:12px;max-height:60vh;overflow-y:auto">
        <div style="padding:16px;text-align:center;color:var(--text-secondary);font-size:13px">
          🤖 你好！我是你的记账 AI 助手。<br>可以问我：上个月餐饮花了多少？哪项支出增长最快？
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <input type="text" id="ai-question" placeholder="问点什么..." style="flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none">
        <button class="btn btn-primary" id="btn-ai-send" style="width:auto;padding:12px 20px;white-space:nowrap">发送</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn btn-sm btn-outline" onclick="aiQuickAsk('上个月各项支出分别是多少')">上月支出分布</button>
        <button class="btn btn-sm btn-outline" onclick="aiQuickAsk('哪项支出增长最快')">增长最快</button>
        <button class="btn btn-sm btn-outline" onclick="aiQuickAsk('给我一些省钱建议')">省钱建议</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== Chart.js 动态加载 =====
let Chart = null;
function loadChart() {
  return new Promise((resolve, reject) => {
    if (Chart) return resolve(Chart);
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
    script.onload = () => { Chart = window.Chart; resolve(Chart); };
    script.onerror = () => reject(new Error('Chart.js 加载失败'));
    document.head.appendChild(script);
  });
}

// ===== 数据层 =====
const STORAGE_KEY = 'accounting_records';
function getRecords() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function saveRecords(records) { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

const EXPENSE_CATS = ['餐饮','交通','购物','娱乐','居住','通讯','医疗','教育','其他支出'];
const INCOME_CATS = ['工资','兼职','理财','红包','其他收入'];

function formatMoney(n) { return '¥' + Number(n || 0).toFixed(2); }
function fmtDate(d) { return d.substring(5); }
function getMonthKey(d) { return d.substring(0, 7); }
function getNowDate() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function getThisMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
// ===== 渲染 =====
let trendChart = null, categoryChart = null;

function renderAll() {
  renderSummary();
  renderRecent();
  renderRecords();
  updateFilterOptions();
}

function renderSummary() {
  const records = getRecords();
  const thisMonth = getThisMonth();
  let income = 0, expense = 0;
  records.forEach(r => {
    if (getMonthKey(r.date) !== thisMonth) return;
    if (r.type === 'income') income += r.amount;
    else expense += r.amount;
  });
  document.getElementById('sum-income').textContent = formatMoney(income);
  document.getElementById('sum-expense').textContent = formatMoney(expense);
  document.getElementById('sum-balance').textContent = formatMoney(income - expense);
}

function renderRecent() {
  const records = getRecords();
  const recent = [...records].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 5);
  const el = document.getElementById('recent-list');
  if (!recent.length) { el.innerHTML = '<div class="empty-msg">还没有记录，开始记第一笔吧 🎉</div>'; return; }
  el.innerHTML = `<table>
    <thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th></tr></thead>
    <tbody>${recent.map(r => `
      <tr><td>${fmtDate(r.date)}</td>
        <td><span class="tag ${r.type==='income'?'tag-income':'tag-expense'}">${r.type==='income'?'收入':'支出'}</span></td>
        <td>${r.category}</td>
        <td style="font-weight:600;color:${r.type==='income'?'var(--income)':'var(--expense)'}">${r.type==='income'?'+':'-'}${formatMoney(r.amount)}</td>
        <td style="color:var(--text-secondary);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.note||'-'}</td>
      </tr>`).join('')}</tbody></table>`;
}

function renderRecords() {
  const records = getRecords();
  const allSorted = [...records].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  const fMonth = document.getElementById('filter-month')?.value || '';
  const fType = document.getElementById('filter-type')?.value || '';
  const fCat = document.getElementById('filter-category')?.value || '';
  const fNote = (document.getElementById('filter-note')?.value || '').toLowerCase();

  const filtered = allSorted.filter(r => {
    if (fMonth && getMonthKey(r.date) !== fMonth) return false;
    if (fType && r.type !== fType) return false;
    if (fCat && r.category !== fCat) return false;
    if (fNote && !(r.note||'').toLowerCase().includes(fNote)) return false;
    return true;
  });

  document.getElementById('record-count').textContent = `共 ${filtered.length} 条`;
  const tbody = document.getElementById('records-body');
  if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="6"><div class="empty-msg">暂无匹配记录</div></td></tr>'; return; }

  tbody.innerHTML = filtered.map(r => `
    <tr><td>${r.date}</td>
      <td><span class="tag ${r.type==='income'?'tag-income':'tag-expense'}">${r.type==='income'?'收入':'支出'}</span></td>
      <td>${r.category}</td>
      <td style="font-weight:600;color:${r.type==='income'?'var(--income)':'var(--expense)'}">${r.type==='income'?'+':'-'}${formatMoney(r.amount)}</td>
      <td style="color:var(--text-secondary);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.note||'-'}</td>
      <td><button class="btn btn-sm btn-danger" onclick="deleteRecord(${r.id})">删除</button></td>
    </tr>`).join('');
}

function updateFilterOptions() {
  const records = getRecords();
  const months = [...new Set(records.map(r => getMonthKey(r.date)))].sort().reverse();
  const fMonth = document.getElementById('filter-month');
  if (fMonth) fMonth.innerHTML = '<option value="">全部月份</option>' + months.map(m => `<option value="${m}">${m}</option>`).join('');
  const cats = [...new Set(records.map(r => r.category))].sort();
  const fCat = document.getElementById('filter-category');
  if (fCat) fCat.innerHTML = '<option value="">全部分类</option>' + cats.map(c => `<option value="${c}">${c}</option>`).join('');
}

async function renderCharts() {
  const section = document.getElementById('sec-stats');
  if (!section.classList.contains('active')) return;

  await loadChart();
  const records = getRecords();

  const last6Months = [];
  const d = new Date();
  for (let i = 5; i >= 0; i--) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    last6Months.push(m.getFullYear() + '-' + String(m.getMonth()+1).padStart(2,'0'));
  }
  const monthlyIncome = last6Months.map(m =>
    records.filter(r => getMonthKey(r.date) === m && r.type === 'income').reduce((s,r) => s + r.amount, 0));
  const monthlyExpense = last6Months.map(m =>
    records.filter(r => getMonthKey(r.date) === m && r.type === 'expense').reduce((s,r) => s + r.amount, 0));

  const ctx1 = document.getElementById('chart-trend').getContext('2d');
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(ctx1, {
    type: 'bar',
    data: { labels: last6Months, datasets: [
      { label: '收入', data: monthlyIncome, backgroundColor: '#67c23a', borderRadius: 4 },
      { label: '支出', data: monthlyExpense, backgroundColor: '#f56c6c', borderRadius: 4 }
    ]},
    options: {
      responsive: true,
      plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 16, boxWidth: 10 } } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => '¥' + v } } }
    }
  });

  const thisMonth = getThisMonth();
  const catMap = {};
  records.filter(r => getMonthKey(r.date) === thisMonth && r.type === 'expense').forEach(r => { catMap[r.category] = (catMap[r.category] || 0) + r.amount; });
  const catLabels = Object.keys(catMap);
  const catValues = Object.values(catMap);
  const colors = ['#f56c6c','#e6a23c','#409eff','#67c23a','#909399','#b37feb','#5cdbd3','#ff85c0','#ffc069'];

  const ctx2 = document.getElementById('chart-category').getContext('2d');
  if (categoryChart) categoryChart.destroy();
  categoryChart = new Chart(ctx2, {
    type: 'doughnut',
    data: { labels: catLabels, datasets: [{ data: catValues, backgroundColor: catLabels.map((_,i) => colors[i%colors.length]), borderWidth: 0 }] },
    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, padding: 12, boxWidth: 10 } } } }
  });

  const allMonths = [...new Set(records.map(r => getMonthKey(r.date)))].sort().reverse();
  const st = document.getElementById('monthly-summary');
  if (!allMonths.length) { st.innerHTML = '<tr><td colspan="4"><div class="empty-msg">暂无数据</div></td></tr>'; }
  else {
    st.innerHTML = allMonths.map(m => {
      const inc = records.filter(r => getMonthKey(r.date) === m && r.type === 'income').reduce((s,r) => s + r.amount, 0);
      const exp = records.filter(r => getMonthKey(r.date) === m && r.type === 'expense').reduce((s,r) => s + r.amount, 0);
      return `<tr><td>${m}</td><td style="color:var(--income)">${formatMoney(inc)}</td><td style="color:var(--expense)">${formatMoney(exp)}</td><td style="color:${inc-exp>=0?'var(--income)':'var(--expense)'};font-weight:600">${formatMoney(inc-exp)}</td></tr>`;
    }).join('');
  }
}

// ===== 操作 =====
function addRecord() {
  const type = document.querySelector('.type-btn.active-expense, .type-btn.active-income')?.dataset.type || 'expense';
  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('category').value;
  const date = document.getElementById('date').value;
  const note = document.getElementById('note').value.trim();
  if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
  if (!date) { alert('请选择日期'); return; }
  if (type === 'expense' && INCOME_CATS.includes(category)) { alert('支出记录请选支出分类'); return; }
  if (type === 'income' && EXPENSE_CATS.includes(category)) { alert('收入记录请选收入分类'); return; }

  const records = getRecords();
  records.push({ id: Date.now(), type, amount, category, date, note });
  saveRecords(records);
  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
  document.getElementById('date').value = getNowDate();
  renderAll();
}

function deleteRecord(id) {
  if (!confirm('确定删除？')) return;
  saveRecords(getRecords().filter(r => r.id !== id));
  renderAll();
}

function exportData() {
  const records = getRecords();
  if (!records.length) { alert('无数据可导出'); return; }
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `记账备份_${getNowDate()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      const existing = getRecords();
      const ids = new Set(existing.map(r => r.id));
      const newRecords = data.filter(r => !ids.has(r.id));
      if (!newRecords.length) { alert('无新数据'); return; }
      if (!confirm(`导入 ${newRecords.length} 条新记录？`)) return;
      saveRecords([...existing, ...newRecords]);
      renderAll();
      alert(`已导入 ${newRecords.length} 条`);
    } catch { alert('文件格式错误'); }
  };
  reader.readAsText(file);
}

function clearAllData() {
  if (!confirm('⚠️ 确定清空所有记账数据？此操作不可恢复！')) return;
  if (!confirm('再次确认：真的要删除所有数据吗？')) return;
  saveRecords([]);
  renderAll();
}

function updateCategoryOptions(type) {
  const select = document.getElementById('category');
  const cats = type === 'income' ? INCOME_CATS : EXPENSE_CATS;
  const labels = type === 'income' ? ['💼 工资','💻 兼职','📈 理财','🧧 红包','📌 其他收入']
    : ['🍔 餐饮','🚗 交通','🛍️ 购物','🎮 娱乐','🏠 居住','📱 通讯','💊 医疗','📚 教育','📌 其他支出'];
  select.innerHTML = `<optgroup label="${type==='income'?'收入':'支出'}分类">` +
    cats.map((c,i) => `<option value="${c}">${labels[i]}</option>`).join('') + '</optgroup>';
}

// ===== AI 助手 =====
const AI_KEY_STORAGE = 'ai_api_key';
const DEEPSEEK_API = 'https://api.deepseek.com/chat/completions';

function getApiKey() { return localStorage.getItem(AI_KEY_STORAGE); }
function saveApiKey(key) { localStorage.setItem(AI_KEY_STORAGE, key); }

// Save key and show chat
document.getElementById('btn-save-key').addEventListener('click', () => {
  const key = document.getElementById('ai-key-input').value.trim();
  if (!key.startsWith('sk-')) { alert('API Key 格式不对，应该以 sk- 开头'); return; }
  saveApiKey(key);
  document.getElementById('ai-setup').style.display = 'none';
  document.getElementById('ai-chat-area').style.display = '';
});

// Enter to send
document.getElementById('ai-question').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btn-ai-send').click();
});

function aiQuickAsk(q) { document.getElementById('ai-question').value = q; document.getElementById('btn-ai-send').click(); }

// Build a compact summary of all records for the AI
function buildRecordsSummary() {
  const records = getRecords();
  if (!records.length) return '用户还没有任何记账记录。';

  // Group by month
  const byMonth = {};
  records.forEach(r => {
    const m = getMonthKey(r.date);
    if (!byMonth[m]) byMonth[m] = {};
    if (!byMonth[m][r.category]) byMonth[m][r.category] = { income: 0, expense: 0 };
    if (r.type === 'income') byMonth[m][r.category].income += r.amount;
    else byMonth[m][r.category].expense += r.amount;
  });

  let summary = '## 用户记账数据\n';
  const months = Object.keys(byMonth).sort();
  months.forEach(m => {
    let mInc = 0, mExp = 0;
    Object.values(byMonth[m]).forEach(v => { mInc += v.income; mExp += v.expense; });
    summary += `\n### ${m}（收入 ${mInc.toFixed(2)} / 支出 ${mExp.toFixed(2)}）\n`;
    Object.entries(byMonth[m]).sort(([,a],[,b]) => (b.expense - a.expense)).forEach(([cat, v]) => {
      const parts = [];
      if (v.expense > 0) parts.push(`支出 ¥${v.expense.toFixed(2)}`);
      if (v.income > 0) parts.push(`收入 ¥${v.income.toFixed(2)}`);
      if (parts.length) summary += `- ${cat}: ${parts.join(' / ')}\n`;
    });
  });

  // Overall totals
  const totalInc = records.filter(r => r.type === 'income').reduce((s,r) => s + r.amount, 0);
  const totalExp = records.filter(r => r.type === 'expense').reduce((s,r) => s + r.amount, 0);
  summary += `\n全部累计：收入 ¥${totalInc.toFixed(2)} / 支出 ¥${totalExp.toFixed(2)} / 结余 ¥${(totalInc-totalExp).toFixed(2)}`;
  summary += `\n记录总数：${records.length} 条`;

  return summary;
}

function addAIMessage(role, content) {
  const el = document.getElementById('ai-messages');
  const div = document.createElement('div');
  div.className = `ai-msg ${role}`;
  div.innerHTML = `<div class="role">${role === 'user' ? '👤 你' : '🤖 AI 助手'}</div>` +
    content.split('\n').filter(Boolean).map(line =>
      line.startsWith('#') ? `<p><strong>${line.replace(/^#+\s*/, '')}</strong></p>` :
      line.startsWith('- ') ? `<p style="padding-left:12px">${line}</p>` :
      line.startsWith('*') ? `<p style="padding-left:12px">${line.replace(/^\*\s*/, '· ')}</p>` :
      `<p>${line}</p>`
    ).join('');
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

document.getElementById('btn-ai-send').addEventListener('click', async () => {
  const key = getApiKey();
  if (!key) { document.getElementById('ai-setup').style.display = ''; document.getElementById('ai-chat-area').style.display = 'none'; return; }

  const question = document.getElementById('ai-question').value.trim();
  if (!question) return;

  document.getElementById('ai-question').value = '';
  addAIMessage('user', question);

  // Show loading
  const loadEl = document.createElement('div');
  loadEl.className = 'ai-loading';
  loadEl.innerHTML = '<span class="dot-flash">分析中</span>';
  loadEl.id = 'ai-loading-msg';
  document.getElementById('ai-messages').appendChild(loadEl);
  document.getElementById('ai-messages').scrollTop = document.getElementById('ai-messages').scrollHeight;
  document.getElementById('btn-ai-send').disabled = true;

  try {
    const summary = buildRecordsSummary();
    const resp = await fetch(DEEPSEEK_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [
          { role: 'system', content: `你是记账分析助手。根据用户提供的记账数据回答问题。简洁回复，使用 ¥ 符号表示金额。数据如下：\n\n${summary}` },
          { role: 'user', content: question }
        ],
        temperature: 0.3, max_tokens: 1000
      })
    });

    document.getElementById('ai-loading-msg')?.remove();

    if (!resp.ok) {
      const err = await resp.text();
      if (resp.status === 401) {
        addAIMessage('assistant', 'API Key 无效，请重新设置。');
        localStorage.removeItem(AI_KEY_STORAGE);
        document.getElementById('ai-setup').style.display = '';
        document.getElementById('ai-chat-area').style.display = 'none';
      } else {
        addAIMessage('assistant', `请求失败 (${resp.status})：${err.substring(0, 200)}`);
      }
    } else {
      const data = await resp.json();
      addAIMessage('assistant', data.choices[0].message.content);
    }
  } catch (err) {
    document.getElementById('ai-loading-msg')?.remove();
    addAIMessage('assistant', `网络错误：${err.message}`);
    document.getElementById('btn-ai-send').disabled = false;
  }
  document.getElementById('btn-ai-send').disabled = false;
});

// On AI tab activate, check for existing key
(function initAI() {
  if (getApiKey()) {
    document.getElementById('ai-setup').style.display = 'none';
    document.getElementById('ai-chat-area').style.display = '';
  }
})();

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');

    if (this.dataset.tab === 'list') updateFilterOptions();
  });
});

// Type toggle
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active-expense', 'active-income'));
    this.classList.add(this.dataset.type === 'expense' ? 'active-expense' : 'active-income');
    updateCategoryOptions(this.dataset.type);
  });
});

document.getElementById('btn-add').addEventListener('click', addRecord);
document.getElementById('date').value = getNowDate();
updateCategoryOptions('expense'); // 初始只显示支出分类

// Filter listeners
['filter-month','filter-type','filter-category'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('change', renderRecords);
});
document.getElementById('filter-note')?.addEventListener('input', renderRecords);

// Action buttons
document.getElementById('btn-export')?.addEventListener('click', exportData);

  if (e.target.files[0]) { importData(e.target.files[0]); e.target.value = ''; }
});

// Initial render
renderAll();
